<!DOCTYPE html>
<html>
<head>
<title>Tic Tac Toe</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Tic Tac Toe</h1>

<!-- Mode Selection -->
<div id="modeSelect">
    <button onclick="showNameInput()">Player vs Player</button>
</div>

<!-- Player Name Input -->
<div id="nameInput" style="display:none;">
    <h2>Enter Player Names</h2>

    <input type="text" id="player1" placeholder="Player 1 Name">
    <input type="text" id="player2" placeholder="Player 2 Name">

    <br><br>

    <button onclick="startGame()">Start Game</button>
</div>

<!-- Game Section -->
<div id="gameArea" style="display:none;">

<h2 id="status"></h2>

<div class="board">
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
</div>

<button onclick="restartGame()">Restart</button>

</div>

<script src="script.js"></script>

</body>
</html>
