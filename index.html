<!DOCTYPE html>
<html>

<head>
<title>Tic Tac Toe Pro</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Tic Tac Toe</h1>

<div id="menu">
<h2>Select Mode</h2>

<button onclick="selectMode('pvp')">Player vs Player</button>
<button onclick="selectMode('pvc')">Player vs Computer</button>
</div>


<div id="names" style="display:none">

<h2>Enter Player Names</h2>

<input id="p1" placeholder="Player 1">
<input id="p2" placeholder="Player 2">

<button onclick="startPVP()">Start Game</button>

</div>


<div id="symbolChoice" style="display:none">

<h2>Choose Your Symbol</h2>

<button onclick="chooseSymbol('X')">X</button>
<button onclick="chooseSymbol('O')">O</button>

</div>


<div id="difficulty" style="display:none">

<h2>Select Difficulty</h2>

<button onclick="setDifficulty('easy')">Easy</button>
<button onclick="setDifficulty('medium')">Medium</button>
<button onclick="setDifficulty('hard')">Hard</button>

</div>


<div id="scoreboard">

<span id="player1">Player1</span> :
<span id="score1">0</span>

|

<span id="player2">Player2</span> :
<span id="score2">0</span>

</div>


<h2 id="status"></h2>


<div class="board">

<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>

<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>

<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>

</div>


<button onclick="restart()">Restart</button>
<button onclick="goHome()">Back</button>

<script src="script.js"></script>

</body>
</html>
