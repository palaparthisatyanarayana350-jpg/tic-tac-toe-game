<!DOCTYPE html>
<html>
<head>
<title>Tic Tac Toe</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Tic Tac Toe</h1>

<!-- MODE SELECT -->
<div id="modeSelect">
<h2>Select Mode</h2>

<button onclick="selectMode('pvp')">Player vs Player</button>
<button onclick="selectMode('pvc')">Player vs Computer</button>
</div>

<!-- SYMBOL SELECT -->
<div id="symbolSelect" style="display:none">
<h2>Choose Your Symbol</h2>

<button onclick="setSymbol('X')">X</button>
<button onclick="setSymbol('O')">O</button>
</div>

<!-- DIFFICULTY -->
<div id="difficultySelect" style="display:none">
<h2>Select Difficulty</h2>

<button onclick="setDifficulty('easy')">Easy</button>
<button onclick="setDifficulty('medium')">Medium</button>
<button onclick="setDifficulty('hard')">Hard</button>
</div>

<!-- GAME AREA -->
<div id="gameArea" style="display:none">

<h2 id="status"></h2>

<div id="scoreboard">
Player: <span id="playerScore">0</span>
Computer: <span id="computerScore">0</span>
</div>

<div class="board">
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
</div>

<button onclick="restartGame()">Restart</button>

</div>

<script src="script.js"></script>

</body>
</html>
